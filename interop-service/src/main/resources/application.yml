server:
  port: 8088

spring:
  application:
    name: interop-service
  # 集中配置（可选）：Config Server 不可达时不阻断启动，各 ${ENV:default} 兜底继续生效。
  config:
    import: "optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}"
  data:
    redis:
      url: ${SPRING_DATA_REDIS_URL:redis://localhost:6379/0}

app:
  interop:
    agent-base-url: ${AGENT_BASE_URL:http://localhost:18085}
    conversation-base-url: ${CONVERSATION_BASE_URL:http://localhost:8081}
    connect-timeout: ${INTEROP_CONNECT_TIMEOUT:1s}
    read-timeout: ${INTEROP_READ_TIMEOUT:30s}
    # A2A message/stream 代理 conversation /chat/stream 的读超时；须 > 流式 emitter 超时(130s 内)。
    stream-read-timeout: ${INTEROP_STREAM_READ_TIMEOUT:120s}
    # live capability discovery：Agent capability 的唯一事实源。置 false 时只暴露 interop 本地 ping；
    # 下游暂时不可达时使用 last-known-good，冷启动不可达则不宣称不存在的 Agent 工具。
    discovery-enabled: ${INTEROP_DISCOVERY_ENABLED:true}
    capability-ttl: ${INTEROP_CAPABILITY_TTL:60s}
    # 生产/多副本必须使用 redis；本地测试可用 memory。
    state-store: ${INTEROP_STATE_STORE:memory}
    state-namespace: ${INTEROP_STATE_NAMESPACE:platform:interop:a2a}
    state-ttl: ${INTEROP_STATE_TTL:7d}
    capability-registry-key: ${INTEROP_CAPABILITY_REGISTRY_KEY:platform:interop:capability-registry:v1}
    a2a:
      agent-name: ${INTEROP_A2A_AGENT_NAME:langchain4j-platform}
      base-url: ${INTEROP_A2A_BASE_URL:http://localhost:8080}
      version: ${INTEROP_A2A_VERSION:0.1.0}
      # 必须与 edge 认证模式一致：only=Bearer，dual=Bearer/API key，apikey=legacy。
      auth-mode: ${INTEROP_A2A_AUTH_MODE:only}
      # A2A push 中继：agent 任务终态 webhook 回到 interop 自己，再按 A2A 信封回推客户端。
      push-callback-base-url: ${INTEROP_A2A_PUSH_CALLBACK_BASE_URL:http://localhost:8088}
      # 回推客户端时的版本化 HMAC 签名密钥；生产必须从独立 Secret 注入。
      push-hmac-secret: ${INTEROP_A2A_PUSH_HMAC_SECRET:dev-only-a2a-webhook-signing-secret-change-me-32b}
      # 与 push HMAC/JWT 分离的 base64 AES-256 key；Redis state 时必填。
      push-encryption-key: ${INTEROP_A2A_PUSH_ENCRYPTION_KEY:}

platform:
  security:
    jwt-secret: ${INTERNAL_JWT_SECRET:dev-only-internal-secret-change-me-please-32b}
    allow-api-key-fallback: ${INTERNAL_API_KEY_FALLBACK:false}
    authentication-required: ${INTERNAL_AUTH_REQUIRED:true}
    api-keys:
      dev-key-acme:
        tenant: acme
        user: alice
        scopes: [agent]

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
