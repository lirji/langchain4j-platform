server:
  port: 8082

spring:
  application:
    name: workflow-service
  # 集中配置（可选）：Config Server 不可达时不阻断启动，各 ${ENV:default} 兜底继续生效。
  config:
    import: "optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}"

platform:
  gateway:
    base-url: ${GATEWAY_BASE_URL:http://localhost:4000/v1}
    api-key: ${GATEWAY_API_KEY:sk-litellm-master}
    model-name: ${GATEWAY_MODEL:chat-default}
  security:
    jwt-secret: ${INTERNAL_JWT_SECRET:dev-only-internal-secret-change-me-please-32b}
    async-worker:
      header: ${ASYNC_TASK_WORKER_JWT_HEADER:X-Async-Worker-Token}
      secret: ${ASYNC_TASK_WORKER_JWT_SECRET:dev-only-async-worker-secret-change-me-32b}
      issuer: ${ASYNC_TASK_WORKER_JWT_ISSUER:platform-services}
      audience: ${ASYNC_TASK_WORKER_JWT_AUDIENCE:async-task-worker}
      key-id: ${ASYNC_TASK_WORKER_JWT_KEY_ID:async-task-worker-v1}
      ttl: ${ASYNC_TASK_WORKER_JWT_TTL_SECONDS:60}s
      clock-skew: ${ASYNC_TASK_WORKER_JWT_CLOCK_SKEW_SECONDS:5}s
      service-id: workflow-service
    allow-api-key-fallback: ${INTERNAL_API_KEY_FALLBACK:false}
    authentication-required: ${INTERNAL_AUTH_REQUIRED:true}
    api-keys:
      dev-key-acme:
        tenant: acme
        user: alice
        scopes: [chat, approve]

app:
  workflow:
    enabled: ${WORKFLOW_ENABLED:true}
    datasource:
      url: ${WORKFLOW_DB_URL:jdbc:mysql://localhost:3306/flowable?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&nullCatalogMeansCurrent=true}
      username: ${WORKFLOW_DB_USER:workflow_app}
      password: ${WORKFLOW_DB_PASSWORD:workflow-app-dev}
    # ServiceTask 内 AI 能力来源（C2 / B9）。
    # mode=http（默认，推荐 prod）：经 tenant/trace 传播的 RestTemplate 调 conversation-service，
    #   workflow 断开对本地 ChatModel 的依赖；HTTP 失败抛异常，交 ServiceTaskDelegates 的 withRetry+降级兜底接管。
    # mode=local：保留 DefaultWorkflowAiClient 本地兜底（零依赖 dev/test 或 conversation 不可达时）。
    ai-client:
      mode: ${WORKFLOW_AI_CLIENT_MODE:http}
      agent-scope-base-url: ${WORKFLOW_AI_CLIENT_AGENTSCOPE_BASE_URL:http://localhost:8085}
      conversation-base-url: ${CONVERSATION_BASE_URL:http://localhost:8081}
      connect-timeout: ${WORKFLOW_AI_CLIENT_CONNECT_TIMEOUT:1s}
      read-timeout: ${WORKFLOW_AI_CLIENT_READ_TIMEOUT:3s}
    # 终态通知发送模式。默认 local 以维持零依赖 dev/test（async-task 需 async-task-service 在跑）；
    # async-task 为一等支持路径、推荐 prod 默认，但为不破坏现有测试此处默认值保持 local。
    terminal-notification:
      mode: ${WORKFLOW_TERMINAL_NOTIFICATION_MODE:local}
      async-task-base-url: ${ASYNC_TASK_BASE_URL:http://localhost:8086}
      async-task-kind: ${WORKFLOW_TERMINAL_ASYNC_TASK_KIND:workflow.terminal}
      fallback-to-local-outbox: ${WORKFLOW_TERMINAL_FALLBACK_LOCAL:true}
    outbox:
      poll-interval-ms: ${WORKFLOW_OUTBOX_POLL_INTERVAL_MS:30000}
      batch-size: ${WORKFLOW_OUTBOX_BATCH_SIZE:50}
      max-attempts: ${WORKFLOW_OUTBOX_MAX_ATTEMPTS:6}
      base-backoff-ms: ${WORKFLOW_OUTBOX_BASE_BACKOFF_MS:5000}
      timeout: ${WORKFLOW_OUTBOX_TIMEOUT:5s}
      claim-ttl: ${WORKFLOW_OUTBOX_CLAIM_TTL:2m}
      hmac-secret: ${WORKFLOW_OUTBOX_HMAC_SECRET:dev-only-workflow-webhook-signing-secret-change-me-32b}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
