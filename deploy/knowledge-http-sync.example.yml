# 作为额外Spring配置文件加载；只挂载到knowledge-ingest-api或combined角色。
# 功能默认开启；完成V7/V8迁移并升级所有knowledge角色后再加载来源。
# 升级期间显式设置KNOWLEDGE_HTTP_SYNC_ENABLED=false，准备完成后恢复true。
app:
  rag:
    http-sync:
      enabled: ${KNOWLEDGE_HTTP_SYNC_ENABLED:true}
      sources:
        - id: product-faq
          tenant-id: ${KNOWLEDGE_HTTP_SYNC_TENANT}
          user-id: ${KNOWLEDGE_HTTP_SYNC_USER}
          department: ${KNOWLEDGE_HTTP_SYNC_DEPARTMENT}
          endpoint: ${KNOWLEDGE_HTTP_SYNC_ENDPOINT}
          bearer-token: ${KNOWLEDGE_HTTP_SYNC_TOKEN:}
          allow-insecure-http: false
          # 可选：同租户且具备ingest权限的运营用户；不会改变上面的后台执行身份。
          operator-user-ids: []
