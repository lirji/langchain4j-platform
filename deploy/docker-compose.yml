# 本地整网：LiteLLM(AI 网关) + Redis + MySQL + Kafka + Qdrant + Elasticsearch/Kibana + 各服务。
# 用法见 deploy/README.md。基础设施(litellm/redis/mysql/kafka/qdrant/elasticsearch/kibana)先起，应用服务需先 `mvn -DskipTests package`。
# 注意：标准栈默认走百炼 text-embedding-v4 + qwen3-rerank + qwen3-vl-plus。
#       凭据由 start-*.sh 从 BAILIAN_CREDENTIAL_CSV 指向的本地 CSV 注入，不写入本文件或 Git。
name: langchain4j-platform

x-app-security: &app-security
  user: "10001:10001"
  read_only: true
  init: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=256m,mode=1777

x-schema-migration: &schema-migration
  <<: *app-security
  image: ${DATABASE_MIGRATIONS_IMAGE:-platform-database-migrations:local}
  build:
    context: ../database-migrations
  restart: "no"
  depends_on:
    mysql:
      condition: service_healthy

services:
  litellm:
    # 固定 tag（不再用浮动 main-stable）：spend 记账/virtual key/UI 依赖其自带 Prisma schema，
    # 浮动镜像升级可能带不兼容 migration。升级流程：先备份 litellm-postgres 卷再换 tag。
    image: ghcr.io/berriai/litellm:${LITELLM_IMAGE_TAG:-v1.74.3-stable}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-master}
      # chat-default 主目标 = DeepSeek（云端，OpenAI 兼容）。key 取自宿主环境变量，不落盘。
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # vision-default = 百炼 qwen3-vl-plus；启动脚本从本地凭据 CSV 注入，不写入仓库/.env。
      BAILIAN_BASE_URL: ${BAILIAN_BASE_URL:-}
      BAILIAN_API_KEY: ${BAILIAN_API_KEY:-}
      BAILIAN_VISION_MODEL: ${BAILIAN_VISION_MODEL:-openai/qwen3-vl-plus}
      # ── spend 记账 / virtual key / 管理 UI（http://localhost:4000/ui，master key 或下面 UI 账号登录）──
      # LiteLLM 只支持 Postgres（独立于业务 MySQL）；DATABASE_URL 存在即自动跑 Prisma migration。
      DATABASE_URL: postgresql://litellm:${LITELLM_PG_PASSWORD:-litellm-dev-pw}@litellm-postgres:5432/litellm
      STORE_MODEL_IN_DB: "false"   # 模型路由仍以 config.yaml 为准（配置即代码），UI 里只读不改
      UI_USERNAME: ${LITELLM_UI_USERNAME:-admin}
      UI_PASSWORD: ${LITELLM_UI_PASSWORD:-litellm-ui-dev}
      # ── 响应缓存（复用栈内 Redis；cache 细节在 config.yaml litellm_settings.cache_params）──
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # ── LiteLLM 自身 OTel span → Jaeger（与 Java 服务同 collector，跨 Java/LiteLLM 同 trace 关联）──
      # 注意：otlp_http 必须带完整 /v1/traces 路径，只给到 :4318 会 404（真机验证过的坑）
      OTEL_EXPORTER: otlp_http
      OTEL_ENDPOINT: http://jaeger:4318/v1/traces
      OTEL_SERVICE_NAME: litellm-proxy
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    ports:
      - "4000:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # 让容器内 LiteLLM 能回连宿主机 Ollama
    depends_on:
      litellm-postgres:
        condition: service_healthy   # 等 PG 就绪再起，避免 Prisma migration 撞未就绪库
      redis:
        condition: service_started

  # LiteLLM 专用 Postgres（spend/virtual key/team 状态）。独立实例：业务侧是 MySQL，且不让
  # 第三方 Prisma schema 与业务库同生命周期。刻意不映射宿主端口（authz-postgres 等易撞 5432）。
  litellm-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${LITELLM_PG_PASSWORD:-litellm-dev-pw}
    volumes:
      - litellm-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 3s
      retries: 12

  # 追踪 collector + UI（http://localhost:16686）。版本与 docs/平台工程/observability-guide.md 一致。
  # Java 侧追踪默认关（MANAGEMENT_TRACING_ENABLED=false 兜底）；开启后与 LiteLLM span 同 trace。
  jaeger:
    image: jaegertracing/all-in-one:1.57
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${JAEGER_OTLP_PORT:-4318}:4318"

  redis:
    image: redis:7-alpine
    # appendonly 持久化 + 命名卷：限流/令牌预算/成本/语义缓存/文档注册表等跨重启存活
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: platform
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  migrate-auth:
    <<: *schema-migration
    environment:
      MIGRATION_SCHEMA: auth
      MIGRATION_DB_URL: jdbc:mysql://mysql:3306/auth?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&nullCatalogMeansCurrent=true
      MIGRATION_DB_USER: auth_migrator
      MIGRATION_DB_PASSWORD: auth-migration-dev

  migrate-async-task:
    <<: *schema-migration
    environment:
      MIGRATION_SCHEMA: async-task
      MIGRATION_DB_URL: jdbc:mysql://mysql:3306/async_task?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&nullCatalogMeansCurrent=true
      MIGRATION_DB_USER: async_task_migrator
      MIGRATION_DB_PASSWORD: async-task-migration-dev

  migrate-workflow:
    <<: *schema-migration
    environment:
      MIGRATION_SCHEMA: workflow
      MIGRATION_DB_URL: jdbc:mysql://mysql:3306/flowable?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      MIGRATION_DB_USER: workflow_migrator
      MIGRATION_DB_PASSWORD: workflow-migration-dev

  migrate-knowledge-graph:
    <<: *schema-migration
    environment:
      MIGRATION_SCHEMA: knowledge-graph
      MIGRATION_DB_URL: jdbc:mysql://mysql:3306/knowledge_graph?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&nullCatalogMeansCurrent=true
      MIGRATION_DB_USER: knowledge_graph_migrator
      MIGRATION_DB_PASSWORD: knowledge-graph-migration-dev

  migrate-knowledge-ingestion:
    <<: *schema-migration
    environment:
      MIGRATION_SCHEMA: knowledge-ingestion
      MIGRATION_DB_URL: jdbc:mysql://mysql:3306/knowledge_ingestion?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      MIGRATION_DB_USER: knowledge_ingestion_migrator
      MIGRATION_DB_PASSWORD: knowledge-ingestion-migration-dev

  migrate-order:
    <<: *schema-migration
    environment:
      MIGRATION_SCHEMA: order
      MIGRATION_DB_URL: jdbc:mysql://mysql:3306/order_service?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&nullCatalogMeansCurrent=true
      MIGRATION_DB_USER: order_migrator
      MIGRATION_DB_PASSWORD: order-migration-dev

  migrate-channel:
    <<: *schema-migration
    environment:
      MIGRATION_SCHEMA: channel
      MIGRATION_DB_URL: jdbc:mysql://mysql:3306/channel?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&nullCatalogMeansCurrent=true
      MIGRATION_DB_USER: channel_migrator
      MIGRATION_DB_PASSWORD: channel-migration-dev

  migrate-analytics-demo:
    <<: *schema-migration
    environment:
      MIGRATION_SCHEMA: analytics-demo
      MIGRATION_DB_URL: jdbc:mysql://mysql:3306/nl2sql_demo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&useInformationSchema=true
      MIGRATION_DB_USER: analytics_demo_migrator
      MIGRATION_DB_PASSWORD: analytics-demo-migration-dev

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9092"

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  # Elasticsearch（默认开启，ES 全文混排 + RRF）。自建镜像装 analysis-smartcn 中文分析器。
  # knowledge-service 用自建 EsGateway，故其 application.yml 已排除 Spring 的 ES 自动配置/健康指示器。
  elasticsearch:
    build: ./es
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Kibana：浏览/查询 ES 数据的官方 Web UI（http://localhost:5601 → Dev Tools 跑 DSL）。
  # 较重(~1G+ RAM)；不需要可 `docker compose stop kibana`（不影响 ES 混排）。
  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      SERVER_PUBLICBASEURL: http://localhost:5601
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  # 集中配置分发（可选）。默认 native 后端（读打包进 jar 的 config/ 目录），无需 git。
  # 刻意不作为其它服务的 depends_on 阻塞条件：各服务用 optional import，server 不在也照常启动。
  config-server:
    <<: *app-security
    build:
      context: ../config-server
    environment:
      CONFIG_SERVER_PORT: 8888
      SPRING_PROFILES_ACTIVE: ${CONFIG_SERVER_PROFILE:-native}
      # 切 git 后端：CONFIG_SERVER_PROFILE=git + SPRING_CLOUD_CONFIG_SERVER_GIT_URI=...
      SPRING_CLOUD_CONFIG_SERVER_GIT_URI: ${SPRING_CLOUD_CONFIG_SERVER_GIT_URI:-}
    ports:
      - "8888:8888"

  conversation-service:
    <<: *app-security
    build:
      context: ../conversation-service
    environment:
      GATEWAY_BASE_URL: http://litellm:4000/v1
      GATEWAY_API_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-master}
      GATEWAY_MODEL: chat-default
      # LiteLLM 租户归因：none(默认,行为与历史一致) / user(spend 按 end-user=租户归集) / virtual-key(per-tenant key,预算/限流硬保底)。
      # virtual-key 档另需 PLATFORM_GATEWAY_TENANT_VIRTUAL_KEYS_<TENANT>=sk-...（Secret 注入，不进 compose/git）。
      PLATFORM_GATEWAY_TENANT_ATTRIBUTION: ${PLATFORM_GATEWAY_TENANT_ATTRIBUTION:-none}
      # 分布式追踪默认关；置 true 后 LLM 出站带 traceparent，与 LiteLLM span 同 trace（Jaeger :16686）
      MANAGEMENT_TRACING_ENABLED: ${MANAGEMENT_TRACING_ENABLED:-false}
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
      CONVERSATION_RAG_ENABLED: ${CONVERSATION_RAG_ENABLED:-true}
      KNOWLEDGE_BASE_URL: http://knowledge-service:8084
      CONVERSATION_RAG_TOP_K: ${CONVERSATION_RAG_TOP_K:-5}
      CONVERSATION_RAG_CATEGORY: ${CONVERSATION_RAG_CATEGORY:-}
      # 独立 conversation runtime 尚处 decision-gate/shadow 阶段；默认关闭且不创建候选服务。
      CONVERSATION_SHADOW_ENABLED: ${CONVERSATION_SHADOW_ENABLED:-false}
      CONVERSATION_SHADOW_BASE_URL: ${CONVERSATION_SHADOW_BASE_URL:-}
      CONVERSATION_SHADOW_HISTORY_MAX_MESSAGES: ${CONVERSATION_SHADOW_HISTORY_MAX_MESSAGES:-12}
      CONVERSATION_SHADOW_HISTORY_MAX_CHARS: ${CONVERSATION_SHADOW_HISTORY_MAX_CHARS:-6000}
      CONVERSATION_SHADOW_HISTORY_MAX_MESSAGE_CHARS: ${CONVERSATION_SHADOW_HISTORY_MAX_MESSAGE_CHARS:-2000}
      # ── 能力展示：纯靠 DeepSeek 栈即可跑通的对话高级能力，默认打开（前端 catalog 对应 state=ready）──
      CONVERSATION_ROUTER_ENABLED: ${CONVERSATION_ROUTER_ENABLED:-true}          # /chat/auto 意图路由
      CONVERSATION_ROUTER_ORDER_ENABLED: ${CONVERSATION_ROUTER_ORDER_ENABLED:-true}
      ORDER_BASE_URL: http://order-service:8093
      CHAT_CASCADE_ENABLED: ${CHAT_CASCADE_ENABLED:-true}                        # /chat/cascade 级联降级（cheap/strong 留空退化默认模型）
      CONVERSATION_MEMORY_PROFILE_ENABLED: ${CONVERSATION_MEMORY_PROFILE_ENABLED:-true}  # /chat/memory + GET/DELETE /memory/profile 长期画像
      # chat.vision：依赖 vision-service 启用且配了可路由的视觉模型（见下方 vision-service）；否则 /chat/vision 上游不可用
      CONVERSATION_VISION_ENABLED: ${CONVERSATION_VISION_ENABLED:-true}
      CONVERSATION_VISION_BASE_URL: http://vision-service:8090
      # chat.mcp：需一个可达的 MCP server。开启但无 server 会在启动握手时失败拖垮本服务，故默认关。
      # 启用：置 true 并把 URL 指向真实 MCP（streamable-http），如 http://host.docker.internal:3001/mcp
      CONVERSATION_MCP_ENABLED: ${CONVERSATION_MCP_ENABLED:-false}
      CONVERSATION_MCP_TRANSPORT: ${CONVERSATION_MCP_TRANSPORT:-http}
      CONVERSATION_MCP_HTTP_URL: ${CONVERSATION_MCP_HTTP_URL:-http://host.docker.internal:3001/mcp}
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET:-dev-only-internal-secret-change-me-please-32b}
      INTERNAL_AUTH_REQUIRED: "true"
      INTERNAL_API_KEY_FALLBACK: "false"
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
    depends_on:
      - litellm
      - knowledge-service
      - order-service
    ports:
      - "8081:8081"

  workflow-service:
    <<: *app-security
    build:
      context: ../workflow-service
    environment:
      WORKFLOW_ENABLED: "true"
      WORKFLOW_DB_URL: jdbc:mysql://mysql:3306/flowable?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      WORKFLOW_DB_USER: workflow_app
      WORKFLOW_DB_PASSWORD: workflow-app-dev
      GATEWAY_BASE_URL: http://litellm:4000/v1
      GATEWAY_API_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-master}
      GATEWAY_MODEL: chat-default
      PLATFORM_GATEWAY_TENANT_ATTRIBUTION: ${PLATFORM_GATEWAY_TENANT_ATTRIBUTION:-none}
      MANAGEMENT_TRACING_ENABLED: ${MANAGEMENT_TRACING_ENABLED:-false}
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET:-dev-only-internal-secret-change-me-please-32b}
      INTERNAL_AUTH_REQUIRED: "true"
      INTERNAL_API_KEY_FALLBACK: "false"
      CONVERSATION_BASE_URL: http://conversation-service:8081
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
      WORKFLOW_OUTBOX_HMAC_SECRET: ${WORKFLOW_OUTBOX_HMAC_SECRET:-dev-only-workflow-webhook-hmac-change-me-32b}
      WORKFLOW_OUTBOX_CLAIM_TTL: ${WORKFLOW_OUTBOX_CLAIM_TTL:-2m}
      PLATFORM_SECURITY_CALLBACK_REQUIRE_ALLOWED_ORIGIN: ${WORKFLOW_CALLBACK_REQUIRE_ALLOWED_ORIGIN:-true}
      PLATFORM_SECURITY_CALLBACK_ALLOW_HTTP: ${WORKFLOW_CALLBACK_ALLOW_HTTP:-false}
      PLATFORM_SECURITY_CALLBACK_ALLOWED_ORIGINS: ${WORKFLOW_CALLBACK_ALLOWED_ORIGINS:-https://callbacks.example.com}
      WORKFLOW_TERMINAL_NOTIFICATION_MODE: async-task
      ASYNC_TASK_BASE_URL: http://async-task-service:8086
      ASYNC_TASK_WORKER_JWT_HEADER: ${ASYNC_TASK_WORKER_JWT_HEADER:-X-Async-Worker-Token}
      ASYNC_TASK_WORKER_JWT_SECRET: ${ASYNC_TASK_WORKER_JWT_SECRET:-dev-only-async-worker-secret-change-me-32b}
      ASYNC_TASK_WORKER_JWT_ISSUER: ${ASYNC_TASK_WORKER_JWT_ISSUER:-platform-services}
      ASYNC_TASK_WORKER_JWT_AUDIENCE: ${ASYNC_TASK_WORKER_JWT_AUDIENCE:-async-task-worker}
      ASYNC_TASK_WORKER_JWT_KEY_ID: ${ASYNC_TASK_WORKER_JWT_KEY_ID:-async-task-worker-v1}
      ASYNC_TASK_WORKER_JWT_TTL_SECONDS: ${ASYNC_TASK_WORKER_JWT_TTL_SECONDS:-60}
      ASYNC_TASK_WORKER_JWT_CLOCK_SKEW_SECONDS: ${ASYNC_TASK_WORKER_JWT_CLOCK_SKEW_SECONDS:-5}
    depends_on:
      migrate-workflow:
        condition: service_completed_successfully
      litellm:
        condition: service_started
      async-task-service:
        condition: service_started
      conversation-service:
        condition: service_started
    ports:
      - "8082:8082"

  analytics-service:
    <<: *app-security
    build:
      context: ../analytics-service
    environment:
      NL2SQL_ENABLED: "true"
      NL2SQL_DB_URL: jdbc:mysql://mysql:3306/nl2sql_demo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&useInformationSchema=true
      NL2SQL_DB_READONLY_URL: jdbc:mysql://mysql:3306/nl2sql_demo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&useInformationSchema=true
      NL2SQL_DB_READONLY_USER: nl2sql_ro
      NL2SQL_DB_READONLY_PASSWORD: nl2sql-readonly-dev
      GATEWAY_BASE_URL: http://litellm:4000/v1
      GATEWAY_API_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-master}
      GATEWAY_MODEL: chat-default
      PLATFORM_GATEWAY_TENANT_ATTRIBUTION: ${PLATFORM_GATEWAY_TENANT_ATTRIBUTION:-none}
      MANAGEMENT_TRACING_ENABLED: ${MANAGEMENT_TRACING_ENABLED:-false}
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET:-dev-only-internal-secret-change-me-please-32b}
      INTERNAL_AUTH_REQUIRED: "true"
      INTERNAL_API_KEY_FALLBACK: "false"
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
    depends_on:
      migrate-analytics-demo:
        condition: service_completed_successfully
      litellm:
        condition: service_started
    ports:
      - "8083:8083"

  knowledge-service:
    <<: *app-security
    build:
      context: ../knowledge-service
    extra_hosts:
      - "host.docker.internal:host-gateway"   # 仅切回可选 Ollama embedding provider 时使用
    environment:
      GATEWAY_BASE_URL: http://litellm:4000/v1
      GATEWAY_API_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-master}
      PLATFORM_GATEWAY_TENANT_ATTRIBUTION: ${PLATFORM_GATEWAY_TENANT_ATTRIBUTION:-none}
      MANAGEMENT_TRACING_ENABLED: ${MANAGEMENT_TRACING_ENABLED:-false}
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
      # 默认直连百炼 text-embedding-v4；要零外部模型依赖可显式设 provider=hash（无语义）。
      RAG_EMBEDDING_PROVIDER: ${RAG_EMBEDDING_PROVIDER:-openai}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-text-embedding-v4}
      # openai provider 可独立直连阿里云百炼等 OpenAI-compatible /embeddings，
      # 不复用/覆盖 GATEWAY_*，避免影响 RAG rerank/query-expansion/contextual 所用的聊天模型。
      RAG_EMBEDDING_BASE_URL: ${RAG_EMBEDDING_BASE_URL:-}
      RAG_EMBEDDING_API_KEY: ${RAG_EMBEDDING_API_KEY:-}
      # 直接映射 Spring 属性，保证使用尚未重建的旧镜像时也不会回退到 platform.gateway.*。
      APP_RAG_EMBEDDING_BASE_URL: ${RAG_EMBEDDING_BASE_URL:-}
      APP_RAG_EMBEDDING_API_KEY: ${RAG_EMBEDDING_API_KEY:-}
      RAG_EMBEDDING_DIMENSIONS: ${RAG_EMBEDDING_DIMENSIONS:-1024}
      RAG_EMBEDDING_MAX_SEGMENTS_PER_BATCH: ${RAG_EMBEDDING_MAX_SEGMENTS_PER_BATCH:-10}
      RAG_EMBEDDING_OLLAMA_BASE_URL: ${RAG_EMBEDDING_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # nomic 非对称任务前缀（尾部空格必须保留）：对齐 query/document 向量空间，提升检索准确率
      RAG_EMBEDDING_QUERY_PREFIX: "search_query: "
      RAG_EMBEDDING_DOCUMENT_PREFIX: "search_document: "
      RAG_VECTOR_STORE_PROVIDER: ${RAG_VECTOR_STORE_PROVIDER:-qdrant}
      RAG_VECTOR_STORE_BASE_COLLECTION: ${RAG_VECTOR_STORE_BASE_COLLECTION:-knowledge_segments_bailian_v4}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6334
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-knowledge_segments_bailian_v4}
      RAG_REGISTRY_STORE: ${RAG_REGISTRY_STORE:-redis}
      # 公共/共享知识库（默认开启）：查询在隔离查各自租户基础上并入 __public__ 公共分区。回滚设 RAG_PUBLIC_ENABLED=false。
      RAG_PUBLIC_ENABLED: ${RAG_PUBLIC_ENABLED:-true}
      # ── 细粒度授权（接 auth-platform / SpiceDB ReBAC）。默认 disabled（与接入前逐字一致）──
      # disabled | shadow（照写关系、读双算记差异但不拦截，灰度观测）| enforce（读按 ReBAC 真过滤）。
      # 灰度顺序：disabled → shadow（观测 knowledge.authz.* 指标）→ 单租户 enforce → 扩大。切回 shadow 即回滚。
      RAG_AUTHZ_MODE: ${RAG_AUTHZ_MODE:-disabled}
      # auth-platform-server(:8200)。该服务不在本 compose（在 auth-platform 仓库自带 deploy），故走宿主机地址。
      AUTHZ_SERVER_URL: ${AUTHZ_SERVER_URL:-http://host.docker.internal:8200}
      # service credential：须与 auth-platform-server 的 authz.server.security.token 一致；server 未开鉴权时留空。
      AUTHZ_SERVER_TOKEN: ${AUTHZ_SERVER_TOKEN:-}
      # 候选/批次安全上限（非法值启动失败）。默认值见 application.yml，可按压测调整。
      RAG_AUTHZ_CANDIDATE_MULTIPLIER: ${RAG_AUTHZ_CANDIDATE_MULTIPLIER:-3}
      RAG_AUTHZ_MAX_CANDIDATES: ${RAG_AUTHZ_MAX_CANDIDATES:-200}
      RAG_AUTHZ_BULK_SIZE: ${RAG_AUTHZ_BULK_SIZE:-100}
      RAG_HYBRID_ENABLED: ${RAG_HYBRID_ENABLED:-true}
      # 混合检索关键词半边用 HanLP 中文分词（默认 simple=bigram），仅影响 keyword/graph 分支，不碰向量。
      RAG_HYBRID_TOKENIZER: ${RAG_HYBRID_TOKENIZER:-hanlp}
      # ── ES 全文混排（默认开启）：BM25 关键词分支并入混合检索，多源 RRF 融合 ──
      RAG_ES_ENABLED: ${RAG_ES_ENABLED:-true}
      RAG_ES_URIS: ${RAG_ES_URIS:-http://elasticsearch:9200}
      RAG_ES_ANALYZER: ${RAG_ES_ANALYZER:-smartcn}      # 中文分析器（镜像已装 analysis-smartcn）
      RAG_FUSION_STRATEGY: ${RAG_FUSION_STRATEGY:-rrf}   # 免疫 BM25/余弦量纲差；留空亦会因 ES 开启取有效默认 rrf
      RAG_RANKING_VECTOR_WEIGHT: ${RAG_RANKING_VECTOR_WEIGHT:-1.0}
      RAG_RANKING_KEYWORD_WEIGHT: ${RAG_RANKING_KEYWORD_WEIGHT:-1.0}
      RAG_RANKING_GRAPH_WEIGHT: ${RAG_RANKING_GRAPH_WEIGHT:-1.0}
      # ── 检索质量：相关性下限 + 重排（避免无阈值 top-k 凑数返回不相关文档，如零售查询命中 SSO 手册）──
      # min-score 只作用于向量源，比较 langchain4j 归一化相关度 [0,1]（cosine ≈ (cos+1)/2，不相关≈0.5）。
      # 0.6 为起点：先跑一次看真实命中分数（响应/日志），把 floor 卡在“真相关分”与“凑数分”之间；过高会返回空。
      RAG_QUERY_MIN_SCORE: ${RAG_QUERY_MIN_SCORE:-0.6}
      # 重排（默认开）：llm 复用 LiteLLM，bailian 批量调用 qwen3-rerank；覆盖全部召回通道。
      # 每次查询增加一次模型调用，候选池 = top-k × RAG_RERANK_CANDIDATE_MULTIPLIER。
      RAG_RERANK_ENABLED: ${RAG_RERANK_ENABLED:-true}
      RAG_RERANK_TYPE: ${RAG_RERANK_TYPE:-bailian}
      # 重排相关性阈值(0..1)：低于此分的候选丢弃 → topK 成为"上限"，不再凑数返回不相关文档（方案③）。
      # 0.5 为起点：先看日志/响应里的真实 rerank 分，把它卡在“真相关分”与“凑数分”之间；过高会返回空。
      RAG_RERANK_MIN_SCORE: ${RAG_RERANK_MIN_SCORE:-0.5}
      # 百炼 qwen3-rerank：compatible-api 与 embedding 的 compatible-mode 是两个不同入口。
      RAG_RERANK_BAILIAN_BASE_URL: ${RAG_RERANK_BAILIAN_BASE_URL:-}
      RAG_RERANK_BAILIAN_API_KEY: ${RAG_RERANK_BAILIAN_API_KEY:-}
      RAG_RERANK_BAILIAN_MODEL: ${RAG_RERANK_BAILIAN_MODEL:-qwen3-rerank}
      RAG_RERANK_BAILIAN_INSTRUCT: ${RAG_RERANK_BAILIAN_INSTRUCT:-Given a user question, retrieve passages that directly answer it.}
      RAG_RERANK_BAILIAN_TIMEOUT: ${RAG_RERANK_BAILIAN_TIMEOUT:-30s}
      RAG_RERANK_BAILIAN_MAX_DOCUMENTS: ${RAG_RERANK_BAILIAN_MAX_DOCUMENTS:-500}
      RAG_GRAPH_ENABLED: ${RAG_GRAPH_ENABLED:-true}
      RAG_GRAPH_STORE: ${RAG_GRAPH_STORE:-jdbc}
      RAG_GRAPH_INCLUDE_IN_QUERY: ${RAG_GRAPH_INCLUDE_IN_QUERY:-${RAG_GRAPH_ENABLED:-true}}
      RAG_GRAPH_QUERY_TOP_K: ${RAG_GRAPH_QUERY_TOP_K:-20}
      RAG_GRAPH_RELATION_WHITELIST: ${RAG_GRAPH_RELATION_WHITELIST:-}
      RAG_GRAPH_ALIASES: ${RAG_GRAPH_ALIASES:-}
      RAG_GRAPH_DB_URL: jdbc:mysql://mysql:3306/knowledge_graph?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&nullCatalogMeansCurrent=true
      RAG_GRAPH_DB_USER: knowledge_graph_app
      RAG_GRAPH_DB_PASSWORD: knowledge-graph-app-dev
      # 图片 RAG：标准启动脚本注入百炼 qwen3-vl-embedding；仍可切回 OpenAI-compatible CLIP/jina。
      RAG_MULTIMODAL_ENABLED: ${RAG_MULTIMODAL_ENABLED:-false}
      RAG_MULTIMODAL_PROVIDER: ${RAG_MULTIMODAL_PROVIDER:-bailian}
      RAG_MULTIMODAL_BASE_URL: ${RAG_MULTIMODAL_BASE_URL:-}
      RAG_MULTIMODAL_API_KEY: ${RAG_MULTIMODAL_API_KEY:-${BAILIAN_API_KEY:-}}
      RAG_MULTIMODAL_MODEL: ${RAG_MULTIMODAL_MODEL:-qwen3-vl-embedding}
      RAG_MULTIMODAL_DIMENSION: ${RAG_MULTIMODAL_DIMENSION:-1024}
      RAG_MULTIMODAL_BASE_COLLECTION: ${RAG_MULTIMODAL_BASE_COLLECTION:-knowledge_images_bailian_qwen3vl}
      # 指向栈内 redis 容器：registry/semantic-cache/rate-limit/token-budget/cost 默认已持久化到 redis
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET:-dev-only-internal-secret-change-me-please-32b}
      INTERNAL_AUTH_REQUIRED: "true"
      INTERNAL_API_KEY_FALLBACK: "false"
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
    depends_on:
      migrate-knowledge-graph:
        condition: service_completed_successfully
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      elasticsearch:
        condition: service_healthy   # 等 ES 就绪再起，避免首次入库 index create 撞 ES 未起
    ports:
      - "8084:8084"

