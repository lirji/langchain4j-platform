# Apply this resource before helm install/upgrade. Replace the SecretStore and Vault path
# with environment-owned values; do not add real credentials to this repository.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-migration-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: platform-migration-secrets
    creationPolicy: Owner
  data:
    - secretKey: AUTH_MIGRATION_DB_PASSWORD
      remoteRef:
        key: secret/data/langchain4j-platform/db-migrations
        property: auth-password
    - secretKey: ASYNC_TASK_MIGRATION_DB_PASSWORD
      remoteRef:
        key: secret/data/langchain4j-platform/db-migrations
        property: async-task-password
    - secretKey: WORKFLOW_MIGRATION_DB_PASSWORD
      remoteRef:
        key: secret/data/langchain4j-platform/db-migrations
        property: workflow-password
    - secretKey: ORDER_MIGRATION_DB_PASSWORD
      remoteRef:
        key: secret/data/langchain4j-platform/db-migrations
        property: order-password
    - secretKey: RAG_INGESTION_MIGRATION_DB_PASSWORD
      remoteRef:
        key: secret/data/langchain4j-platform/db-migrations
        property: rag-ingestion-password
    - secretKey: RAG_GRAPH_MIGRATION_DB_PASSWORD
      remoteRef:
        key: secret/data/langchain4j-platform/db-migrations
        property: rag-graph-password
    - secretKey: CHANNEL_MIGRATION_DB_PASSWORD
      remoteRef:
        key: secret/data/langchain4j-platform/db-migrations
        property: channel-password
    - secretKey: NL2SQL_MIGRATION_DB_PASSWORD
      remoteRef:
        key: secret/data/langchain4j-platform/db-migrations
        property: nl2sql-demo-password
