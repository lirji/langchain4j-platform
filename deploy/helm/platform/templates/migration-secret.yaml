{{- if and .Values.migrations.enabled .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ required "migrations.secretName is required" .Values.migrations.secretName }}
  labels:
    app.kubernetes.io/name: platform-schema-migrator
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: langchain4j-platform
    app.kubernetes.io/component: schema-migration
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-30"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  {{- range $key, $value := .Values.migrations.placeholderPasswords }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
