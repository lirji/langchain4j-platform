  labels:
    app.kubernetes.io/name: agentscope-downstream
    app.kubernetes.io/part-of: langchain4j-platform
  annotations:
    platform.lrj.com/secret-source: "placeholder — AgentScope external provider delegation only"
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets.agentscopeDownstream }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
