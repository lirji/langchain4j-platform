server:
  port: 8086

spring:
  application:
    name: async-task-service
  # 集中配置（可选）：Config Server 不可达时不阻断启动，各 ${ENV:default} 兜底继续生效。
  config:
    import: "optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}"

platform:
  security:
    jwt-secret: ${INTERNAL_JWT_SECRET:dev-only-internal-secret-change-me-please-32b}
    async-worker:
      header: ${ASYNC_TASK_WORKER_JWT_HEADER:X-Async-Worker-Token}
      secret: ${ASYNC_TASK_WORKER_JWT_SECRET:dev-only-async-worker-secret-change-me-32b}
      issuer: ${ASYNC_TASK_WORKER_JWT_ISSUER:platform-services}
      audience: ${ASYNC_TASK_WORKER_JWT_AUDIENCE:async-task-worker}
      key-id: ${ASYNC_TASK_WORKER_JWT_KEY_ID:async-task-worker-v1}
      ttl: ${ASYNC_TASK_WORKER_JWT_TTL_SECONDS:60}s
      clock-skew: ${ASYNC_TASK_WORKER_JWT_CLOCK_SKEW_SECONDS:5}s
      service-id: async-task-service
    allow-api-key-fallback: ${INTERNAL_API_KEY_FALLBACK:false}
    authentication-required: ${INTERNAL_AUTH_REQUIRED:true}
    api-keys:
      dev-key-acme:
        tenant: acme
        user: alice
        scopes: [agent]

app:
  async-task:
    store: ${ASYNC_TASK_STORE:jdbc}
    task-ttl: ${ASYNC_TASK_TTL:PT24H}
    cleanup-delay-ms: ${ASYNC_TASK_CLEANUP_DELAY_MS:60000}
    cleanup-initial-delay-ms: ${ASYNC_TASK_CLEANUP_INITIAL_DELAY_MS:60000}
    event:
      retention: ${ASYNC_TASK_EVENT_RETENTION:PT24H}
      max-bytes: ${ASYNC_TASK_EVENT_MAX_BYTES:262144}
    orphan:
      enabled: ${ASYNC_TASK_ORPHAN_ENABLED:false}
      scan-delay-ms: ${ASYNC_TASK_ORPHAN_SCAN_DELAY_MS:30000}
      initial-delay-ms: ${ASYNC_TASK_ORPHAN_INITIAL_DELAY_MS:30000}
      pending-timeout: ${ASYNC_TASK_ORPHAN_PENDING_TIMEOUT:PT2M}
      lease-grace: ${ASYNC_TASK_ORPHAN_LEASE_GRACE:PT30S}
      batch-size: ${ASYNC_TASK_ORPHAN_BATCH_SIZE:100}
      kinds: ${ASYNC_TASK_ORPHAN_KINDS:agent.task,agent.run,agent.dag,agent.dag-plan,agent.analyst,agent.process}
    datasource:
      url: ${ASYNC_TASK_DB_URL:jdbc:mysql://localhost:3306/async_task?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&nullCatalogMeansCurrent=true}
      username: ${ASYNC_TASK_DB_USER:async_task_app}
      password: ${ASYNC_TASK_DB_PASSWORD:async-task-app-dev}
      driver-class-name: ${ASYNC_TASK_DB_DRIVER:com.mysql.cj.jdbc.Driver}
      maximum-pool-size: ${ASYNC_TASK_DB_MAX_POOL_SIZE:8}
    webhook:
      enabled: ${ASYNC_TASK_WEBHOOK_ENABLED:true}
      max-attempts: ${ASYNC_TASK_WEBHOOK_MAX_ATTEMPTS:3}
      backoff: ${ASYNC_TASK_WEBHOOK_BACKOFF:250ms}
      connect-timeout: ${ASYNC_TASK_WEBHOOK_CONNECT_TIMEOUT:1s}
      read-timeout: ${ASYNC_TASK_WEBHOOK_READ_TIMEOUT:3s}
      poll-interval-ms: ${ASYNC_TASK_WEBHOOK_POLL_INTERVAL_MS:30000}
      batch-size: ${ASYNC_TASK_WEBHOOK_BATCH_SIZE:50}
      claim-ttl: ${ASYNC_TASK_WEBHOOK_CLAIM_TTL:PT2M}
      delivered-retention: ${ASYNC_TASK_WEBHOOK_DELIVERED_RETENTION:P7D}
      hmac-secret: ${ASYNC_TASK_WEBHOOK_HMAC_SECRET:dev-only-async-webhook-signing-secret-change-me-32b}

management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
