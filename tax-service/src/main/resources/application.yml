server:
  port: 8094

spring:
  application:
    name: tax-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}"

platform:
  gateway:
    base-url: ${GATEWAY_BASE_URL:http://localhost:4000/v1}
    api-key: ${GATEWAY_API_KEY:sk-litellm-master}
    model-name: ${GATEWAY_MODEL:chat-default}
  security:
    jwt-secret: ${INTERNAL_JWT_SECRET:dev-only-internal-secret-change-me-please-32b}
    allow-api-key-fallback: ${INTERNAL_API_KEY_FALLBACK:false}
    authentication-required: ${INTERNAL_AUTH_REQUIRED:true}
    api-keys:
      dev-key-tenantA-admin:
        tenant: tenantA
        user: analyst-a
        scopes: [tax-review]

app:
  tax:
    max-invoices: ${TAX_MAX_INVOICES:100}
    rule-set-version: ${TAX_RULE_SET_VERSION:cn-vat-invoice-consistency-v1}
    ai:
      enabled: ${TAX_AI_ENABLED:true}
    knowledge:
      enabled: ${TAX_KNOWLEDGE_ENABLED:true}
      base-url: ${KNOWLEDGE_BASE_URL:http://localhost:8084}
      category: ${TAX_KNOWLEDGE_CATEGORY:tax-policy}
      top-k: ${TAX_KNOWLEDGE_TOP_K:5}
      min-score: ${TAX_KNOWLEDGE_MIN_SCORE:0.2}
      evidence-max-chars: ${TAX_EVIDENCE_MAX_CHARS:600}
      connect-timeout: ${TAX_KNOWLEDGE_CONNECT_TIMEOUT:1s}
      read-timeout: ${TAX_KNOWLEDGE_READ_TIMEOUT:3s}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
