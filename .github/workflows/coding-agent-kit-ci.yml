name: Coding Agent Kit CI

on:
  pull_request:
    paths:
      - '.agents/**'
      - '.codex/agents/**'
      - 'tools/coding-agent-eval/**'
      - 'tools/java-codegraph/**'
      - 'docs/qa/coding-agent-golden/**'
      - 'docs/qa/coding-agent-benchmark/**'
      - 'docs/qa/coding-agent-demo/**'
      - 'docs/平台工程/coding-agent-playbook.md'
      - 'docs/平台工程/coding-agent-sandbox.md'
      - 'docs/平台工程/java-codegraph.md'
      - 'docs/平台工程/ai-coding-training-outline.md'
      - 'docs/delivery/coding-agent-engineering-kit/**'
      - 'docs/delivery/coding-agent-productionization/**'
      - 'AGENTS.md'
      - 'docs/README.md'
      - '.github/workflows/coding-agent-kit-ci.yml'
  push:
    branches: [main]
    paths:
      - '.agents/**'
      - '.codex/agents/**'
      - 'tools/coding-agent-eval/**'
      - 'tools/java-codegraph/**'
      - 'docs/qa/coding-agent-golden/**'
      - 'docs/qa/coding-agent-benchmark/**'
      - 'docs/qa/coding-agent-demo/**'
      - 'docs/平台工程/coding-agent-playbook.md'
      - 'docs/平台工程/coding-agent-sandbox.md'
      - 'docs/平台工程/java-codegraph.md'
      - 'docs/平台工程/ai-coding-training-outline.md'
      - 'docs/delivery/coding-agent-engineering-kit/**'
      - 'docs/delivery/coding-agent-productionization/**'
      - 'AGENTS.md'
      - 'docs/README.md'
      - '.github/workflows/coding-agent-kit-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coding-agent-kit-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate repository Skills and Agents
        run: node tools/coding-agent-eval/cli.mjs validate-kit

      - name: Validate GoldenCase dataset
        run: |
          node tools/coding-agent-eval/cli.mjs validate
          node tools/coding-agent-eval/cli.mjs audit --repo .

      - name: Run evaluator tests
        run: node --test tools/coding-agent-eval/test/*.test.mjs

      - name: Validate sandbox and shell entrypoints
        run: |
          bash -n tools/coding-agent-eval/sandbox/entrypoint.sh
          bash -n tools/coding-agent-eval/test/sandbox-smoke.sh
          bash -n tools/java-codegraph/test/run-tests.sh

      - name: Test Java code graph fixtures
        run: bash tools/java-codegraph/test/run-tests.sh

      - name: Scan current Java source graph
        run: |
          graph_dir="$(mktemp -d)"
          java tools/java-codegraph/CodeGraphCli.java build --root . --output "$graph_dir/graph.json"
          test -s "$graph_dir/graph.json"

      - name: Smoke case discovery
        run: node tools/coding-agent-eval/cli.mjs list --json > /tmp/coding-agent-cases.json
