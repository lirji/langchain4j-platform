name: Edge Gateway CI

on:
  pull_request:
    paths:
      - 'pom.xml'
      - 'platform-security/**'
      - 'edge-gateway/**'
      - '.github/workflows/edge-gateway-ci.yml'
  push:
    branches: [main]
    paths:
      - 'pom.xml'
      - 'platform-security/**'
      - 'edge-gateway/**'
      - '.github/workflows/edge-gateway-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edge-gateway-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -pl edge-gateway -am test
