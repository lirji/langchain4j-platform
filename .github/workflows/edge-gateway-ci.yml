name: Edge Gateway CI

on:
  pull_request:
    paths:
      - 'pom.xml'
      - 'platform-security/**'
      - 'edge-gateway/**'
      - '.github/workflows/edge-gateway-ci.yml'
  push:
    branches: [main]
    paths:
      - 'pom.xml'
      - 'platform-security/**'
      - 'edge-gateway/**'
      - '.github/workflows/edge-gateway-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edge-gateway-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -pl edge-gateway -am test
