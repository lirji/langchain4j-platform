name: Tax AI CI

on:
  pull_request:
    paths:
      - 'pom.xml'
      - 'tax-service/**'
      - 'platform-protocol/src/main/java/com/lrj/platform/protocol/tax/**'
      - 'platform-audit/**'
      - 'platform-security/**'
      - 'platform-gateway-client/**'
      - 'auth-service/**'
      - 'database-migrations/src/main/resources/db/migration/auth/**'
      - 'edge-gateway/**'
      - 'eval-service/**'
      - 'deploy/**'
      - 'tools/java-codegraph/**'
      - 'docs/delivery/tax-invoice-risk-review/**'
      - 'docs/qa/tax-invoice-risk-review/**'
      - '.github/workflows/tax-ai-ci.yml'
  push:
    branches: [main]
    paths:
      - 'pom.xml'
      - 'tax-service/**'
      - 'platform-protocol/src/main/java/com/lrj/platform/protocol/tax/**'
      - 'platform-audit/**'
      - 'platform-security/**'
      - 'platform-gateway-client/**'
      - 'auth-service/**'
      - 'database-migrations/src/main/resources/db/migration/auth/**'
      - 'edge-gateway/**'
      - 'eval-service/**'
      - 'deploy/**'
      - 'tools/java-codegraph/**'
      - 'docs/delivery/tax-invoice-risk-review/**'
      - 'docs/qa/tax-invoice-risk-review/**'
      - '.github/workflows/tax-ai-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tax-ai-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test affected reactor modules and GoldenCase loader
        run: mvn -B -pl tax-service,edge-gateway,auth-service,eval-service,database-migrations -am test

      - name: Validate deployment configuration and shell entrypoints
        run: |
          TAX_HOST_PORT=8095 docker compose -f deploy/docker-compose.yml config --quiet
          bash -n deploy/start-all.sh deploy/start-dev.sh deploy/start-local.sh

      - name: Build and query Java code graph
        run: |
          graph_dir="$(mktemp -d)"
          java tools/java-codegraph/CodeGraphCli.java build --root . --output "$graph_dir/graph.json"
          java tools/java-codegraph/CodeGraphCli.java query --root . --symbol TaxInvoiceReviewService --output "$graph_dir/tax-service.json"
          java tools/java-codegraph/CodeGraphCli.java query --root . --symbol TaxInvoiceRuleEngine --output "$graph_dir/tax-rules.json"
          test -s "$graph_dir/graph.json"
          test -s "$graph_dir/tax-service.json"
          test -s "$graph_dir/tax-rules.json"
