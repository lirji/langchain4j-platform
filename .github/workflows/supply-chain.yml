name: Java supply chain and trusted release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout immutable source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify supply-chain policy
        run: bash deploy/test-supply-chain-config.sh

      - name: Test the complete reactor
        run: mvn -B -DskipITs test

      - name: Package deployable artifacts
        # Tests already passed above; maven.test.skip also prevents downstream test compilation
        # against database-migrations' executable Spring Boot archive during the package reactor.
        run: mvn -B -Dmaven.test.skip=true package

      - name: Generate aggregate CycloneDX SBOM
        run: >
          mvn -B org.cyclonedx:cyclonedx-maven-plugin:2.9.2:makeAggregateBom
          -DschemaVersion=1.6
          -DincludeTestScope=false
          -DoutputFormat=json
          -DoutputName=langchain4j-platform.cdx

      # v0.36.0 is the first selected post-incident release; the immutable peeled commit is pinned.
      - name: Scan aggregate dependency SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: sbom
          scan-ref: target/langchain4j-platform.cdx.json
          format: json
          output: target/trivy-dependencies.json
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload JARs, SBOM and dependency scan evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: java-supply-chain-${{ github.sha }}
          path: |
            */target/*-0.1.0-SNAPSHOT.jar
            target/langchain4j-platform.cdx.json
            target/trivy-dependencies.json
          if-no-files-found: error
          retention-days: 30

  image-scan:
    needs: artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        service:
          - agent-service
          - analytics-service
          - async-task-service
          - auth-service
          - capability-showcase-frontend
          - channel-service
          - config-server
          - conversation-service
          - database-migrations
          - edge-gateway
          - eval-service
          - interop-service
          - knowledge-service
          - order-service
          - vision-service
          - voice-service
          - workflow-service

    steps:
      - name: Checkout immutable source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download verified reactor artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: java-supply-chain-${{ github.sha }}
          path: .

      - name: Build image under test
        run: docker build --tag "local/${{ matrix.service }}:ci-${{ github.sha }}" "${{ matrix.service }}"

      - name: Prepare scan evidence directory
        run: mkdir -p scan-evidence

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/${{ matrix.service }}:ci-${{ github.sha }}
          format: json
          output: scan-evidence/${{ matrix.service }}.json
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload image scan evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: image-scan-${{ matrix.service }}-${{ github.sha }}
          path: scan-evidence/${{ matrix.service }}.json
          if-no-files-found: error
          retention-days: 30

  release-images:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [artifacts, image-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        service:
          - agent-service
          - analytics-service
          - async-task-service
          - auth-service
          - capability-showcase-frontend
          - channel-service
          - config-server
          - conversation-service
          - database-migrations
          - edge-gateway
          - eval-service
          - interop-service
          - knowledge-service
          - order-service
          - vision-service
          - voice-service
          - workflow-service
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/langchain4j-platform-${{ matrix.service }}

    steps:
      - name: Checkout immutable source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download verified reactor artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: java-supply-chain-${{ github.sha }}
          path: .

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.service }}
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Prepare release evidence directory
        run: mkdir -p release-evidence

      - name: Scan exact published digest before signing
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}
          format: json
          output: release-evidence/${{ matrix.service }}-vulnerabilities.json
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate exact image CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}
          format: cyclonedx
          output: release-evidence/${{ matrix.service }}.cdx.json
          scanners: vuln
          exit-code: "0"

      - name: Install Cosign with release verification
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2 / cosign v3.0.6

      - name: Sign exact image digest with GitHub OIDC
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "${IMAGE_NAME}@${IMAGE_DIGEST}"

      - name: Attest image provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attach exact image SBOM attestation
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: release-evidence/${{ matrix.service }}.cdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Upload exact release evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-evidence-${{ matrix.service }}-${{ github.sha }}
          path: release-evidence/
          if-no-files-found: warn
          retention-days: 90

  attest-java-artifacts:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Download verified reactor artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: java-supply-chain-${{ github.sha }}
          path: .

      - name: Attest JAR provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: "*/target/*-0.1.0-SNAPSHOT.jar"

      - name: Attach aggregate SBOM attestation
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: "*/target/*-0.1.0-SNAPSHOT.jar"
          sbom-path: target/langchain4j-platform.cdx.json
