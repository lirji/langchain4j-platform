name: AgentScope Cutover CI

on:
  pull_request:
    paths:
      - 'pom.xml'
      - 'platform-protocol/**'
      - 'platform-security/**'
      - 'interop-service/**'
      - 'edge-gateway/**'
      - 'voice-service/**'
      - 'knowledge-service/**'
      - 'database-migrations/**'
      - 'auth-service/**'
      - 'async-task-service/**'
      - 'workflow-service/**'
      - 'order-service/**'
      - 'channel-service/**'
      - 'analytics-service/**'
      - 'deploy/docker-compose.yml'
      - 'deploy/docker-compose.knowledge-split.yml'
      - 'deploy/start-all.sh'
      - 'deploy/start-local.sh'
      - 'deploy/load-bailian-env.sh'
      - 'deploy/test-bailian-env.sh'
      - 'deploy/test-production-cutover-config.sh'
      - 'deploy/test-runtime-hardening-config.sh'
      - 'deploy/test-database-migration-config.sh'
      - 'deploy/test-supply-chain-config.sh'
      - 'deploy/smoke-knowledge-s3-iam.sh'
      - 'deploy/helm/**'
      - '.github/workflows/agentscope-cutover-ci.yml'
      - '.github/workflows/supply-chain.yml'
  push:
    branches: [main]
    paths:
      - 'pom.xml'
      - 'platform-protocol/**'
      - 'platform-security/**'
      - 'interop-service/**'
      - 'edge-gateway/**'
      - 'voice-service/**'
      - 'knowledge-service/**'
      - 'database-migrations/**'
      - 'auth-service/**'
      - 'async-task-service/**'
      - 'workflow-service/**'
      - 'order-service/**'
      - 'channel-service/**'
      - 'analytics-service/**'
      - 'deploy/docker-compose.yml'
      - 'deploy/docker-compose.knowledge-split.yml'
      - 'deploy/start-all.sh'
      - 'deploy/start-local.sh'
      - 'deploy/load-bailian-env.sh'
      - 'deploy/test-bailian-env.sh'
      - 'deploy/test-production-cutover-config.sh'
      - 'deploy/test-runtime-hardening-config.sh'
      - 'deploy/test-database-migration-config.sh'
      - 'deploy/test-supply-chain-config.sh'
      - 'deploy/smoke-knowledge-s3-iam.sh'
      - 'deploy/helm/**'
      - '.github/workflows/agentscope-cutover-ci.yml'
      - '.github/workflows/supply-chain.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agentscope-cutover-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Verify edge and interop
        run: mvn -B -pl edge-gateway,interop-service -am test

      - name: Verify Bailian multimodal providers
        run: mvn -B -pl voice-service,knowledge-service -am test

      - name: Verify versioned database migrations
        run: mvn -B -pl database-migrations -am test

      - name: Validate Compose
        run: |
          docker compose -f deploy/docker-compose.yml config --quiet
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.knowledge-split.yml config --quiet
          bash -n deploy/start-all.sh deploy/start-local.sh deploy/load-bailian-env.sh deploy/test-bailian-env.sh \
            deploy/test-production-cutover-config.sh deploy/test-runtime-hardening-config.sh \
            deploy/test-database-migration-config.sh deploy/test-supply-chain-config.sh \
            deploy/smoke-knowledge-s3-iam.sh
          bash deploy/test-bailian-env.sh
          bash deploy/test-production-cutover-config.sh
          bash deploy/test-runtime-hardening-config.sh
          bash deploy/test-database-migration-config.sh
          bash deploy/test-supply-chain-config.sh

      - name: Validate Helm
        run: |
          helm lint deploy/helm/platform
          helm template platform deploy/helm/platform > rendered.yaml
          grep -q 'http://agentscope-orchestrator:8085' rendered.yaml
          grep -q 'path: /readiness' rendered.yaml
          grep -q 'key: PLATFORM_SECURITY_JWT_PUBLIC_KEY' rendered.yaml
