name: AgentScope Cutover CI

on:
  pull_request:
    paths:
      - 'pom.xml'
      - 'platform-protocol/**'
      - 'platform-security/**'
      - 'platform-metering/**'
      - 'conversation-service/**'
      - 'deploy/verify-agent-contracts.py'
      - 'deploy/install-auth-sdk.sh'
      - 'deploy/auth-sdk-source.json'
      - 'deploy/test-agent-contract-pin.py'
      - 'deploy/docker-compose.readonly-worker.yml'
      - 'deploy/docker-compose.conversation-shadow.yml'
      - 'interop-service/**'
      - 'edge-gateway/**'
      - 'voice-service/**'
      - 'knowledge-service/**'
      - 'database-migrations/**'
      - 'auth-service/**'
      - 'async-task-service/**'
      - 'workflow-service/**'
      - 'order-service/**'
      - 'channel-service/**'
      - 'analytics-service/**'
      - 'deploy/docker-compose.yml'
      - 'deploy/docker-compose.knowledge-split.yml'
      - 'deploy/start-all.sh'
      - 'deploy/start-local.sh'
      - 'deploy/load-bailian-env.sh'
      - 'deploy/test-bailian-env.sh'
      - 'deploy/test-production-cutover-config.sh'
      - 'deploy/test-runtime-hardening-config.sh'
      - 'deploy/test-database-migration-config.sh'
      - 'deploy/test-supply-chain-config.sh'
      - 'deploy/smoke-knowledge-s3-iam.sh'
      - 'deploy/sync-agent-contracts.sh'
      - 'deploy/helm/**'
      - '.github/workflows/agentscope-cutover-ci.yml'
      - '.github/workflows/supply-chain.yml'
  push:
    branches: [main]
    paths:
      - 'pom.xml'
      - 'platform-protocol/**'
      - 'platform-security/**'
      - 'platform-metering/**'
      - 'conversation-service/**'
      - 'deploy/verify-agent-contracts.py'
      - 'deploy/install-auth-sdk.sh'
      - 'deploy/auth-sdk-source.json'
      - 'deploy/test-agent-contract-pin.py'
      - 'deploy/docker-compose.readonly-worker.yml'
      - 'deploy/docker-compose.conversation-shadow.yml'
      - 'interop-service/**'
      - 'edge-gateway/**'
      - 'voice-service/**'
      - 'knowledge-service/**'
      - 'database-migrations/**'
      - 'auth-service/**'
      - 'async-task-service/**'
      - 'workflow-service/**'
      - 'order-service/**'
      - 'channel-service/**'
      - 'analytics-service/**'
      - 'deploy/docker-compose.yml'
      - 'deploy/docker-compose.knowledge-split.yml'
      - 'deploy/start-all.sh'
      - 'deploy/start-local.sh'
      - 'deploy/load-bailian-env.sh'
      - 'deploy/test-bailian-env.sh'
      - 'deploy/test-production-cutover-config.sh'
      - 'deploy/test-runtime-hardening-config.sh'
      - 'deploy/test-database-migration-config.sh'
      - 'deploy/test-supply-chain-config.sh'
      - 'deploy/smoke-knowledge-s3-iam.sh'
      - 'deploy/sync-agent-contracts.sh'
      - 'deploy/helm/**'
      - '.github/workflows/agentscope-cutover-ci.yml'
      - '.github/workflows/supply-chain.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agentscope-cutover-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Read immutable producer lock
        id: producer
        run: |
          python3 - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import json, re
          lock = json.load(open('platform-protocol/src/main/resources/contracts/agentscope/manifest.json'))
          revision = lock['upstream']['revision']
          assert re.fullmatch('[0-9a-f]{40}', revision)
          print('revision=' + revision)
          PYCODE

      - name: Checkout exact public producer revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: lirji/platform-agentscope
          ref: ${{ steps.producer.outputs.revision }}
          path: _contract-producer
          persist-credentials: false

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.3"

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: _contract-producer/.python-version

      - name: Verify generated producer snapshots and fixed consumer combination
        env:
          AGENTSCOPE_REPO: ${{ github.workspace }}/_contract-producer
        run: |
          uv sync --directory _contract-producer --frozen --dev
          uv run --directory _contract-producer python scripts/export_contracts.py --check
          bash deploy/sync-agent-contracts.sh
          python3 deploy/test-agent-contract-pin.py

      - name: Read immutable IAM SDK source
        id: auth-sdk
        run: |
          python3 - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import json, re
          lock = json.load(open('deploy/auth-sdk-source.json'))
          assert re.fullmatch('[0-9a-f]{40}', lock['revision'])
          print('revision=' + lock['revision'])
          PYCODE

      - name: Checkout pinned IAM SDK
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: lirji/auth-platform
          ref: ${{ steps.auth-sdk.outputs.revision }}
          path: _auth-sdk-source
          persist-credentials: false

      - name: Build and test pinned IAM SDK dependencies
        env:
          AUTH_PLATFORM_REPO: ${{ github.workspace }}/_auth-sdk-source
        run: bash deploy/install-auth-sdk.sh

      - name: Verify full native reactor including reliability slices
        run: mvn -B test

      - name: Validate Compose
        run: |
          docker compose -f deploy/docker-compose.yml config --quiet
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.readonly-worker.yml config --quiet
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.conversation-shadow.yml config --quiet
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.knowledge-split.yml config --quiet
          bash -n deploy/start-all.sh deploy/start-local.sh deploy/load-bailian-env.sh deploy/test-bailian-env.sh \
            deploy/test-production-cutover-config.sh deploy/test-runtime-hardening-config.sh \
            deploy/test-database-migration-config.sh deploy/test-supply-chain-config.sh \
            deploy/smoke-knowledge-s3-iam.sh
          bash deploy/test-bailian-env.sh
          bash deploy/test-production-cutover-config.sh
          bash deploy/test-runtime-hardening-config.sh
          bash deploy/test-database-migration-config.sh
          bash deploy/test-supply-chain-config.sh

      - name: Validate Helm
        run: |
          helm lint deploy/helm/platform
          helm template platform deploy/helm/platform > rendered.yaml
          grep -q 'http://agentscope-orchestrator:8085' rendered.yaml
          grep -q 'path: /readiness' rendered.yaml
          grep -q 'key: PLATFORM_SECURITY_JWT_PUBLIC_KEY' rendered.yaml
